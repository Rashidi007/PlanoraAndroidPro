e{display:grid;gap:8px}.timeBlock{display:flex;gap:10px;align-items:stretch;padding:8px 0}.timeLine{width:54px;color:#8f849a;font-size:11px;padding-top:8px}.blockCard{flex:1;padding:11px 12px;border-radius:14px;background:#17131e;border:1px solid #342a3d;cursor:grab}.blockCard.drag{opacity:.5}.blockCard[data-cat="work"]{border-right:3px solid #68d69d}.blockCard[data-cat="study"]{border-right:3px solid #9a79ff}.blockCard[data-cat="health"]{border-right:3px solid #ff777e}.blockCard[data-cat="personal"]{border-right:3px solid #5aa2ff}.blockCard[data-cat="important"]{border-right:3px solid #ffa55f}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.calHead{font-size:10px;color:var(--muted);text-align:center;padding:6px}.calDay{min-height:80px;padding:8px;border:1px solid #282230;background:#100e15;border-radius:12px;cursor:pointer}.calDay:hover{border-color:#624b73}.calDay.today{border-color:#a765d3;background:#191321}.calDay.other{opacity:.35}.calDay b{font-size:12px}.calEvt{display:block;margin-top:5px;padding:3px 5px;border-radius:6px;background:#21192a;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.viewTabs{display:flex;gap:6px}.searchRow{display:flex;gap:8px;flex-wrap:wrap}.searchRow .input{flex:1;min-width:180px}.tableWrap{overflow:auto}.simpleTable{width:100%;border-collapse:collapse;font-size:12px}.simpleTable th,.simpleTable td{padding:9px;border-bottom:1px solid #2b2533;text-align:right}.barRow{display:grid;grid-template-columns:90px 1fr 45px;gap:8px;align-items:center;margin:10px 0}.legend{font-size:11px;color:var(--muted)}.modal{position:fixed;inset:0;background:#0008;display:none;place-items:center;z-index:80;padding:18px}.modal.open{display:grid}.modalBox{width:min(650px,100%);max-height:90vh;overflow:auto;background:#14111a;border:1px solid #3b3046;border-radius:22px;padding:18px;box-shadow:0 30px 90px #0008}.modalHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.formGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.formGrid .full{grid-column:1/-1}.label{font-size:11px;color:var(--muted);display:grid;gap:6px}.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{border:1px solid #3a3143;background:#0f0d14;border-radius:11px;padding:8px 10px;font-size:11px}.seg button.active{background:#2d1e38;border-color:#8d58c3;color:#efd9ff}.subtasks{display:grid;gap:7px}.subitem{display:flex;gap:7px;align-items:center}.floating{position:fixed;left:18px;bottom:calc(20px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:18px;background:linear-gradient(135deg,#a764db,#775bda);border:1px solid #c38be5;box-shadow:0 12px 35px #8d5fd64c;z-index:50}.bottom{display:none}.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:#1f1828;border:1px solid #4d3b5b;padding:10px 14px;border-radius:12px;font-size:12px;transition:.25s;z-index:120}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.pom{display:grid;place-items:center;padding:16px}.pomCircle{width:230px;height:230px;border-radius:50%;border:8px solid #301f3d;box-shadow:inset 0 0 0 3px #7d58a0;display:grid;place-items:center;background:radial-gradient(circle,#18121f,#0f0c14)}.pomTime{font-size:46px;font-weight:800;letter-spacing:1px}.settingRow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #292330}.switch{position:relative;width:48px;height:27px;background:#2a2430;border-radius:99px}.switch i{position:absolute;top:4px;left:4px;width:19px;height:19px;border-radius:50%;background:#8f8796;transition:.2s}.switch.on{background:#7c4ca1}.switch.on i{left:25px;background:#fff}.smartPlan{display:grid;gap:8px}.smartItem{padding:10px;border-radius:12px;background:#100e15;border:1px solid #2b2533}.focusOverlay{position:fixed;inset:0;background:radial-gradient(circle at center,#21152e,#0907 @media(max-width:380px){.main{padding-left:10px;padding-right:10px}.card{padding:14px;border-radius:18px}.topRight{gap:5px}.topRight .iconBtn{width:38px;height:38px}.topRight #globalDate{width:118px!important}.moods{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.mood{min-height:44px;font-size:20px}.bottom button{font-size:9px}.bottom{padding-left:5px;padding-right:5px}}

<body>
<div id="app"></div>
<div id="modal" class="modal"><div id="modalBox" class="modalBox"></div></div>
<div id="focus" class="focusOverlay"><div class="focusBox"><div class="muted">حالت تمرکز</div><h2 id="focusTask">—</h2><div id="focusTime" class="focusTimer">25:00</div><div class="row" style="justify-content:center"><button class="btn primary" id="focusStart">شروع</button><button class="btn" id="focusStop">توقف</button><button class="btn" id="focusExit">خروج</button></div><div class="kbd" style="margin-top:12px">بعد از اتمام، برای همین کار یک جلسه تمرکز ثبت می‌شود.</div></div></div>
<div id="toast" class="toast"></div>
<script>
(() => {
'use strict';
const KEY='planora-v2';
const LEGACY_KEY='planora-v1';
const $=s=>document.querySelector(s); const $$=s=>[...document.querySelectorAll(s)];
const cats={personal:['شخصی','#5aa2ff'],work:['کار','#68d69d'],study:['تحصیل','#9a79ff'],health:['سلامت','#ff777e'],important:['مهم','#ffa55f']};
const moods=['😄','🙂','😐','😔','😡'];
const faDays=['ی','د','س','چ','پ','ج','ش'];
const empty=()=>({tasks:[],blocks:[],habits:[],reminders:[],notes:[],goals:[],meals:[{name:'',score:0},{name:'',score:0},{name:'',score:0}],mood:'',weather:'',water:0,sleep:0,bed:'',wake:'',gratitude:'',tomorrow:'',income:0,expense:0,saving:0,focusMinutes:0});
let db={days:{},settings:{notifications:true,exactAlarms:true,weekStart:6,pomWork:25,pomBreak:5}};
try{let raw=JSON.parse(localStorage.getItem(KEY)||'');if(!raw||!raw.days){const legacy=JSON.parse(localStorage.getItem(LEGACY_KEY)||'');if(legacy&&legacy.days)raw=legacy} if(raw&&raw.days)db=Object.assign(db,raw,{days:raw.days||{},settings:Object.assign(db.settings,raw.settings||{})})}catch(e){}
let current=localISO(); let page='home'; let filter='all'; let taskSearch=''; let calView='month'; let modalTaskId=null; let focus={id:null,remain:1500,running:false,kind:'work',timer:null};
function localISO(d=new Date()){const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)}
function getDay(date=current){if(!db.days[date]){const d=empty();const prev=Object.keys(db.days).filter(k=>k<date).sort().pop();if(prev&&db.days[prev]?.habits?.length)d.habits=db.days[prev].habits.map(h=>({id:h.id,name:h.name,done:false,score:0}));db.days[date]=d;} const d=db.days[date];d.tasks=d.tasks||[];d.blocks=d.blocks||[];d.habits=d.habits||[];d.goals=d.goals||[];d.meals=d.meals||[{name:'',score:0},{name:'',score:0},{name:'',score:0}];d.water=+d.water||0;d.sleep=+d.sleep||0;return d}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));syncNativeReminders()}catch(e){toast('ذخیره‌سازی محلی در دسترس نیست')}}
function toast(s){const t=$('#toast');t.textContent=s;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),1800)}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function uid(p='id'){return p+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7)}
function fmtDate(d){return new Intl.DateTimeFormat('fa-IR',{weekday:'long',year:'numeric',month:'long',day:'numeric'}).format(new Date(d+'T12:00:00'))}
function fmtShort(d){return new Intl.DateTimeFormat('fa-IR',{month:'short',day:'numeric'}).format(new Date(d+'T12:00:00'))}
function calcSleep(bed,wake){if(!bed||!wake)return null;let [bh,bm]=bed.split(':').map(Number),[wh,wm]=wake.split(':').map(Number);let a=bh*60+bm,b=wh*60+wm;if(b<=a)b+=1440;return (b-a)/60}
function taskMatches(t){if(taskSearch && !(t.title+' '+(t.description||'')+' '+(cats[t.cat]?.[0]||'')).toLowerCase().includes(taskSearch.toLowerCase()))return false;if(filter==='today')return t.date===current;if(filter==='overdue')return t.date<current&&!t.done;if(filter==='important')return t.priority==='high';if(filter==='study')return t.cat==='study';if(filter==='done')return t.done;return true}
function allTasks(){return Object.entries(db.days).flatMap(([date,d])=>(d.tasks||[]).map(t=>({...t,date})))}
function dayScore(d){const h=d.habits.length?d.habits.reduce((a,x)=>a+(x.done?(x.score||0):0),0)/(d.habits.length*10):0; const meals=d.meals||[]; const rated=meals.filter(x=>x&&x.score>0); const food=rated.length?rated.reduce((a,x)=>a+x.score,0)/(rated.length*3):0; const w=Math.min(1,(d.water||0)/8); const s=Math.min(1,(d.sleep||0)/8); const t=d.tasks.length?d.tasks.filter(x=>x.done).length/d.tasks.length:0; const g=d.goals.length?d.goals.reduce((a,x)=>a+(x.pct||0),0)/(d.goals.length*100):0; return Math.round(((h+food+w+s+t+g)/6)*100)/100*10}
function taskStats(){const ts=allTasks();return {total:ts.length,done:ts.filter(t=>t.done).length,remaining:ts.filter(t=>!t.done).length,today:ts.filter(t=>t.date===current&&!t.done).length,overdue:ts.filter(t=>t.date<current&&!t.done).length}}
function habitStreak(h){let n=0,d=new Date(current+'T12:00:00');while(true){const k=localISO(d),day=db.days[k];const x=day?.habits?.find(x=>x.id===h.id);if(!x?.done)break;n++;d.setDate(d.getDate()-1)}return n}
function renderShell(){
const ts=taskStats(); const d=getDay(); const todayTasks=(d.tasks||[]); const progress=todayTasks.length?Math.round(todayTasks.filter(x=>x.done).length/todayTasks.length*100):0;
$('#app').innerHTML=`<div class="app"><aside class="side"><div class="logoBox"><img class="logoMini" src="data:image/svg+xml;utf8,${encodeURIComponent(logoSvg())}"><div class="brand"><strong>Planora</strong><span>برنامه‌ریزی برای زندگی بهتر</span></div></div><div class="nav">${navItems().map(n=>`<button class="navBtn ${page===n.id?'active':''}" data-page="${n.id}">${n.icon}<span>${n.label}</span></button>`).join('')}</div><div class="sideFoot">نسخه شخصی • آفلاین • ذخیره روی دستگاه</div></aside><main class="main"><div class="top"><div><h1>${navItems().find(x=>x.id===page)?.label||'خانه'}</h1><div class="sub">${fmtDate(current)} • <span id="liveClock">--:--</span></div></div><div class="topRight"><button class="btn iconBtn" data-act="prevDay">‹</button><input id="globalDate" class="input" type="date" value="${current}" style="width:150px"><button class="btn iconBtn" data-act="nextDay">›</button><button class="btn" data-page="settings">⚙️</button></div></div>${page==='home'?home():page==='tasks'?tasksPage():page==='calendar'?calendarPage():page==='planner'?plannerPage():page==='habits'?habitsPage():page==='notebook'?notebookPage():page==='stats'?statsPage():page==='more'?morePage():settingsPage()}</main><button class="floating" data-act="quickAdd">＋</button><nav class="bottom">${navItems(true).map(n=>`<button class="${page===n.id?'active':''}" data-page="${n.id}">${n.icon}<br>${n.short||n.label}</button>`).join('')}</nav></div>`;
}
function navItems(mobile=false){const arr=[{id:'home',label:'داشبورد',short:'خانه',icon:'⌂'},{id:'tasks',label:'کارها',short:'کارها',icon:'☑'},{id:'calendar',label:'تقویم',short:'تقویم',icon:'▦'},{id:'planner',label:'برنامه‌ریزی روزانه',short:'برنامه',icon:'◷'},{id:'habits',label:'عادت‌ها',short:'عادت',icon:'◉'},{id:'stats',label:'آمار و تحلیل',short:'تحلیل',icon:'◒'},{id:'notebook',label:'دفترچه روزانه',short:'امروز',icon:'📖'},{id:'more',label:'تمرکز و اهداف',short:'بیشتر',icon:'✦'},{id:'settings',label:'تنظیمات',short:'تنظیمات',icon:'⚙'}]; return mobile?arr.filter(x=>['home','notebook','planner','stats'].includes(x.id)):arr}

function taskModal(date=current,task=null){const t=task||{id:uid('task'),title:'',description:'',priority:'mid',cat:'personal',date,time:'',deadline:'',repeat:'none',done:false,remind:true,subtasks:[]}; modalTaskId=t.id;openModal(`<div class="modalHead"><h2>${task?'ویرایش Task':'ساخت Task'}</h2><button class="btn iconBtn" data-act="closeModal">×</button></div><div class="formGrid"><label class="label full">عنوان<input id="fTitle" class="input" value="${esc(t.title)}" autofocus></label><label class="label full">توضیحات<textarea id="fDesc" class="textarea">${esc(t.description)}</textarea></label><label class="label">اولویت<select id="fPri" class="select"><option value="low" ${t.priority==='low'?'selected':''}>کم</option><option value="mid" ${t.priority==='mid'?'selected':''}>متوسط</option><option value="high" ${t.priority==='high'?'selected':''}>زیاد</option></select></label><label class="label">دسته‌بندی<select id="fCat" class="select">${Object.entries(cats).map(([k,v])=>`<option value="${k}" ${t.cat===k?'selected':''}>${v[0]}</option>`).join('')}</select></label><label class="label">تاریخ<input id="fDate" class="input" type="date" value="${t.date||date}"></label><label class="label">ساعت<input id="fTime" class="input" type="time" value="${t.time||''}"></label><label class="label">Deadline<input id="fDeadline" class="input" type="date" value="${t.deadline||''}"></label><label class="label">هدف<select id="fGoal" class="select"><option value="">بدون هدف</option>${(getDay().goals||[]).map(g=>`<option value="${g.id}" ${t.goalId===g.id?'selected':''}>${esc(g.title)}</option>`).join('')}</select></label><label class="label">تکرار<select id="fRepeat" class="select"><option value="none" ${t.repeat==='none'?'selected':''}>بدون تکرار</option><option value="daily" ${t.repeat==='daily'?'selected':''}>روزانه</option><option value="weekly" ${t.repeat==='weekly'?'selected':''}>هفتگی</option><option value="monthly" ${t.repeat==='monthly'?'selected':''}>ماهانه</option></select></label><label class="label full"><span>زیرکارها (هر خط یک مورد)</span><textarea id="fSubs" class="textarea" placeholder="تحقیق&#10;طراحی&#10;گزارش">${esc((t.subtasks||[]).map(s=>s.text).join('\n'))}</textarea></label><label class="label full"><span>یادآوری</span><div class="seg"><button type="button" class="${t.remind!==false?'active':''}" id="remindYes">فعال</button><button type="button" class="${t.remind===false?'active':''}" id="remindNo">خاموش</button></div></label></div><div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn" data-act="closeModal">انصراف</button><button class="btn primary" id="saveTask" data-act="saveTask">ذخیره Task</button></div>`);let remind=t.remind!==false;$('#remindYes').onclick=()=>{remind=true;$('#remindYes').classList.add('active');$('#remindNo').classList.remove('active')};$('#remindNo').onclick=()=>{remind=false;$('#remindNo').classList.add('active');$('#remindYes').classList.remove('active')};$('#saveTask').dataset.remind=String(remind)}
function blockModal(block=null){const b=block||{id:uid('block'),title:'',start:'08:00',end:'09:00',cat:'personal',note:''};openModal(`<div class="modalHead"><h2>${block?'ویرایش بلوک':'بلوک زمانی جدید'}</h2><button class="btn iconBtn" data-act="closeModal">×</button></div><div class="formGrid"><label class="label full">عنوان<input id="bTitle" class="input" value="${esc(b.title)}"></label><label class="label">شروع<input id="bStart" class="input" type="time" value="${b.start}"></label><label class="label">پایان<input id="bEnd" class="input" type="time" value="${b.end}"></label><label class="label">دسته‌بندی<select id="bCat" class="select">${Object.entries(cats).map(([k,v])=>`<option value="${k}" ${b.cat===k?'selected':''}>${v[0]}</option>`).join('')}</select></label><label class="label full">یادداشت<textarea id="bNote" class="textarea">${esc(b.note||'')}</textarea></label></div><div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn" data-act="closeModal">انصراف</button><button class="btn primary" data-act="saveBlock" data-id="${b.id}">ذخیره</button></div>`)}
function goalModal(){const g={id:uid('goal'),title:'',pct:0,note:''};openModal(`<div class="modalHead"><h2>🎯 هدف جدید</h2><button class="btn iconBtn" data-act="closeModal">×</button></div><div class="formGrid"><label class="label full">عنوان هدف<input id="gTitle" class="input"></label><label class="label full">یادداشت<textarea id="gNote" class="textarea"></textarea></label><label class="label full">پیشرفت <span id="gPctLabel">0٪</span><input id="gPct" type="range" min="0" max="100" value="0"></label></div><div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn" data-act="closeModal">انصراف</button><button class="btn primary" data-act="saveGoal" data-id="${g.id}">افزودن</button></div>`);$('#gPct').addEventListener('input',e=>$('#gPctLabel').textContent=e.target.value+'٪')}
function addHabitModal(){openModal(`<div class="modalHead"><h2>🌱 افزودن عادت</h2><button class="btn iconBtn" data-act="closeModal">×</button></div><label class="label">نام عادت<input id="hName" class="input" placeholder="مثلاً مطالعه"></label><div class="muted" style="margin-top:8px">برای امروز اضافه می‌شود و از همان امروز Streak آن محاسبه می‌شود.</div><div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn" data-act="closeModal">انصراف</button><button class="btn primary" data-act="saveHabit">افزودن</button></div>`)}
function smartPlan(){const d=getDay(), base=new Date(current+'T08:00:00'), tasks=(d.tasks||[]).filter(x=>!x.done).sort((a,b)=>(a.priority==='high'?0:a.priority==='mid'?1:2)-(b.priority==='high'?0:b.priority==='mid'?1:2));let t=8*60, created=[];tasks.slice(0,8).forEach((x,i)=>{const len=60;let h=Math.floor(t/60),m=t%60;let start=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;t+=len;h=Math.floor(t/60);m=t%60;let end=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;created.push({id:uid('block'),title:x.title,start,end,cat:x.cat||'personal',note:'پیشنهاد هوشمند'});t+=15});const habitNames=(d.habits||[]).filter(h=>!h.done).slice(0,3).map(h=>h.name);habitNames.forEach(name=>{const h=Math.floor(t/60),m=t%60,st=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;t+=30;const eh=Math.floor(t/60),em=t%60,en=`${String(eh).padStart(2,'0')}:${String(em).padStart(2,'0')}`;created.push({id:uid('block'),title:'عادت: '+name,start:st,end:en,cat:'health',note:'پیشنهاد هوشمند'});t+=10});d.blocks=created;save();render();toast('برنامه پیشنهادی ساخته شد')}
function findTask(id){for(const [date,d] of Object.entries(db.days)){const t=(d.tasks||[]).find(x=>x.id===id);if(t)return {...t,date}}return null}
function findTaskObj(id,date){return db.days[date]?.tasks?.find(x=>x.id===id)}
function notifyNative(payload){try{if(window.Android&&Android.scheduleReminder)Android.scheduleReminder(JSON.stringify(payload));else if('Notification' in window && Notification.permission==='granted') new Notification(payload.title,{body:payload.body||''});}catch(e){}}
function cancelNative(id){try{if(window.Android&&Android.cancelReminder)Android.cancelReminder(id)}catch(e){}}
function syncNativeReminders(){if(!db.settings.notifications)return;Object.entries(db.days).forEach(([date,d])=>(d.tasks||[]).forEach(t=>{if(t.remind!==false&&t.time&&t.date>=current&&!t.done){const when=new Date(t.date+'T'+t.time).getTime(); if(when>Date.now()+1000)notifyNative({id:t.id,title:t.title,body:t.description||'یادآوری Task',when,repeat:t.repeat||'none',exact:!!db.settings.exactAlarms});}}))}
function repeatCopy(task,fromDate){let nd=new Date(fromDate+'T12:00:00');if(task.repeat==='daily')nd.setDate(nd.getDate()+1);else if(task.repeat==='weekly')nd.setDate(nd.getDate()+7);else if(task.repeat==='monthly')nd.setMonth(nd.getMonth()+1);else return null;return localISO(nd)}
function completeRecurring(task,date){if(task.repeat==='none')return;const next=repeatCopy(task,date);if(!next)return;const c=getDay(next);c.tasks.push({...task,id:uid('task'),date:next,done:false});save()}
function timeDiff(a,b){if(!a||!b)return 60;let [ah,am]=a.split(':').map(Number),[bh,bm]=b.split(':').map(Number);let x=ah*60+am,y=bh*60+bm;if(y<=x)y+=1440;return y-x}function addMinutes(a,n){let [h,m]=a.split(':').map(Number),v=(h*60+m+n)%1440;return String(Math.floor(v/60)).padStart(2,'0')+':'+String(v%60).padStart(2,'0')}
function render(){renderShell();if(page==='stats')setTimeout(drawStats,0);bind();}
function bindTaskDrag(){$$('[data-task-drag="true"]').forEach(el=>{el.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',JSON.stringify({id:el.dataset.id,date:el.dataset.date}));el.classList.add('drag')});el.addEventListener('dragend',()=>el.classList.remove('drag'))});$$('[data-calendar-date]').forEach(el=>{el.addEventListener('dragover',e=>e.preventDefault());el.addEventListener('drop',e=>{e.preventDefault();try{const x=JSON.parse(e.dataTransfer.getData('text/plain'));const src=db.days[x.date]?.tasks||[],t=src.find(q=>q.id===x.id);if(!t)return;src.splice(src.indexOf(t),1);(db.days[el.dataset.calendarDate]??(db.days[el.dataset.calendarDate]=empty())).tasks.push({...t,date:el.dataset.calendarDate});cancelNative(t.id);save();render();toast('Task جابه‌جا شد')}catch(_){}})});}

$$('[data-field]').forEach(el=>el.addEventListener('input',e=>{const k=el.dataset.field;let v=el.value;getDay()[k]=v;if(k==='bed'||k==='wake'){const sl=calcSleep(getDay().bed,getDay().wake);if(sl!=null)getDay().sleep=+sl.toFixed(2);}save();if(k==='bed'||k==='wake')debouncedRender(220)}));
$$('[data-field-num]').forEach(el=>el.addEventListener('input',()=>{getDay()[el.dataset.fieldNum]=Math.max(0,+el.value||0);save()}));
$$('[data-meal-name]').forEach(el=>el.addEventListener('input',()=>{const d=getDay();d.meals=d.meals||[{name:'',score:0},{name:'',score:0},{name:'',score:0}];d.meals[+el.dataset.mealName].name=el.value;save()}));

bindTaskDrag();$$('[draggable="true"]').forEach(el=>{el.addEventListener('dragstart',e=>{el.classList.add('drag');e.dataTransfer.setData('text/plain',el.dataset.blockId)});el.addEventListener('dragend',()=>el.classList.remove('drag'))});$$('.timeBlock[data-drop-start]').forEach(target=>{target.addEventListener('dragover',e=>e.preventDefault());target.addEventListener('drop',e=>{e.preventDefault();const id=e.dataTransfer.getData('text/plain'),moving=getDay().blocks.find(x=>x.id===id);if(!moving)return;const start=target.dataset.dropStart;const dur=Math.max(15,timeDiff(moving.start,moving.end));moving.start=start;moving.end=addMinutes(start,dur);save();render();toast('بلوک جابه‌جا شد')})});
}
function drawStats(){const c=$('#statsCanvas');if(!c)return;const ctx=c.getContext('2d'),w=c.width,h=c.height;ctx.clearRect(0,0,w,h);const ks=Object.keys(db.days).sort().slice(-30),vals=ks.map(k=>dayScore(db.days[k]));ctx.strokeStyle='#342d3d';for(let i=0;i<5;i++){let y=20+i*(h-40)/4;ctx.beginPath();ctx.moveTo(30,y);ctx.lineTo(w-20,y);ctx.stroke()}if(vals.length){ctx.strokeStyle='#b86cff';ctx.lineWidth=3;ctx.beginPath();vals.forEach((v,i)=>{const x=30+(w-50)*(i/Math.max(vals.length-1,1)),y=h-20-(v/10)*(h-40);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke()}}

function updateFocus(){const m=Math.floor(focus.remain/60),s=focus.remain%60;$('#focusTime').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}

document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
if(a==='prevDay')return prevNext(-1);if(a==='nextDay')return prevNext(1);if(a==='closeModal')return closeModal();if(a==='quickAdd')return taskModal(current);
if(a==='addTask')return taskModal(current);if(a==='saveTask'){const existingBefore=modalTaskId?findTask(modalTaskId):null;const newSubs=$('#fSubs').value.split('\n').map(x=>x.trim()).filter(Boolean);const t={id:modalTaskId||uid('task'),title:$('#fTitle').value.trim(),description:$('#fDesc').value,priority:$('#fPri').value,cat:$('#fCat').value,date:$('#fDate').value||current,time:$('#fTime').value,deadline:$('#fDeadline').value,repeat:$('#fRepeat').value,done:false,remind:($('#saveTask').dataset.remind||'true')==='true',goalId:$('#fGoal')?.value||'',subtasks:newSubs.map((x,i)=>({id:existingBefore?.subtasks?.[i]?.id||uid('sub'),text:x,done:!!existingBefore?.subtasks?.[i]?.done}))};let existing=null,existingDate=null;for(const [dk,dd] of Object.entries(db.days)){const ex=(dd.tasks||[]).find(x=>x.id===t.id);if(ex){existing=ex;existingDate=dk;break}}if(existing){t.done=existing.done;t.completedAt=existing.completedAt||null;const reminderChanged=existing.remind!==t.remind||existing.date!==t.date||existing.time!==t.time;if(reminderChanged||t.done||t.remind===false)cancelNative(t.id);db.days[existingDate].tasks=db.days[existingDate].tasks.filter(x=>x.id!==t.id)}if(!t.title)return toast('عنوان Task را وارد کن');(db.days[t.date]??(db.days[t.date]=empty())).tasks.push(t);save();closeModal();render();return}if(a==='editTask'){const t=findTaskObj(b.dataset.id,b.dataset.date);return t&&taskModal(b.dataset.date,t)}
if(a==='deleteTask'){const d=db.days[b.dataset.date];const t=d?.tasks?.find(x=>x.id===b.dataset.id);if(!t)return; if(confirm('این کار حذف شود؟')){d.tasks=d.tasks.filter(x=>x.id!==b.dataset.id);cancelNative(b.dataset.id);save();render()}return}
if(a==='taskToggle'){const d=db.days[b.dataset.date],t=d?.tasks?.find(x=>x.id===b.dataset.id);if(!t)return;t.done=!t.done;if(t.done){t.completedAt=Date.now();cancelNative(t.id);if(t.repeat!=='none'&&!t._nextCreated){t._nextCreated=true;completeRecurring(t,b.dataset.date)}}else{t.completedAt=null;if(t.repeat!=='none'&&t._nextCreated){toast('نسخه بعدی تکرار همچنان در برنامه باقی می‌ماند')}}save();render();return}

if(a==='editBlock'){const x=getDay().blocks.find(z=>z.id===b.dataset.id);if(x)blockModal(x);return}
if(a==='deleteBlock'){getDay().blocks=getDay().blocks.filter(x=>x.id!==b.dataset.id);save();render();return}
if(a==='saveBlock'){const id=b.dataset.id,x={id,title:$('#bTitle').value,start:$('#bStart').value,end:$('#bEnd').value,cat:$('#bCat').value,note:$('#bNote').value};const arr=getDay().blocks,ix=arr.findIndex(z=>z.id===id);if(ix>=0)arr[ix]=x;else arr.push(x);save();closeModal();render();return}
if(a==='addGoal')return goalModal();
if(a==='saveGoal'){const g={id:b.dataset.id,title:$('#gTitle').value.trim(),note:$('#gNote').value,pct:+$('#gPct').value};if(!g.title)return;getDay().goals.push(g);save();closeModal();render();return}
if(a==='deleteGoal'){getDay().goals=getDay().goals.filter(x=>x.id!==b.dataset.id);save();render();return}
if(a==='smartPlan')return smartPlan();
if(a==='focusTask'){const t=findTask(b.dataset.id);focus.id=t?.id||null;focus.remain=db.settings.pomWork*60;focus.running=false;$('#focusTask').textContent=t?.title||'جلسه تمرکز آزاد';updateFocus();$('#focus').classList.add('open');return}
if(a==='openPomodoro'){const t=allTasks().find(x=>!x.done&&(x.date===current));focus.id=t?.id||null;focus.remain=db.settings.pomWork*60;focus.running=false;$('#focusTask').textContent=t?.title||'جلسه تمرکز آزاد';updateFocus();$('#focus').classList.add('open');return}
if(a==='toggleNotif'){db.settings.notifications=!db.settings.notifications;if(db.settings.notifications){try{window.Android&&Android.requestNotifications&&Android.requestNotifications()}catch(_){}}if(!db.settings.notifications){try{window.Android&&Android.cancelAllReminders&&Android.cancelAllReminders()}catch(e){}}save();render();return}
if(a==='toggleExact'){db.settings.exactAlarms=!db.settings.exactAlarms;save(); if(window.Android&&Android.openExactAlarmSettings&&db.settings.exactAlarms)Android.openExactAlarmSettings(); render();return}
if(a==='calPrev'){const d=new Date(current+'T12:00:00');d.setMonth(d.getMonth()-1);current=localISO(d);return render()}
if(a==='calNext'){const d=new Date(current+'T12:00:00');d.setMonth(d.getMonth()+1);current=localISO(d);return render()}
if(a==='export'){const payload=JSON.stringify(db,null,2);try{if(window.Android&&Android.exportBackup){Android.exportBackup(payload);toast('پنجره ذخیره پشتیبان باز شد');return}}catch(_){}const blob=new Blob([payload],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='planora-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),500);toast('پشتیبان آماده شد');return}
if(a==='import'){const inp=document.createElement('input');inp.type='file';inp.accept='application/json';inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(x&&x.days){db=x;save();render();toast('داده‌ها وارد شدند')}}catch(e){toast('فایل نامعتبر است')}};r.readAsText(f)};inp.click();return}
if(a==='reset'){if(confirm('همه داده‌ها پاک شوند؟')){db={days:{},settings:{notifications:true,exactAlarms:true,weekStart:6,pomWork:25,pomBreak:5}};save();render()};return}
});

function updateClock(){const c=$('#liveClock');if(c)c.textContent=new Intl.DateTimeFormat('fa-IR',{hour:'2-digit',minute:'2-digit',second:'2-digit'}).format(new Date())}function boot(){render();updateClock();setInterval(updateClock,1000)}
boot();
})();
